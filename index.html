<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>酷炫作品集</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --accent: #6c63ff;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: #eaeaea;
  }

  header {
    text-align: center;
    padding: 100px 20px 60px;
    background: linear-gradient(135deg, #1b1f2f, #0f1117);
  }

  header h1 {
    font-size: 48px;
    margin-bottom: 10px;
    animation: fadeDown 0.8s ease-out;
  }

  header p {
    opacity: 0.7;
    font-size: 18px;
    animation: fadeUp 0.8s ease-out;
  }

  .container {
    max-width: 1100px;
    margin: auto;
    padding: 40px 20px 80px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 24px;
  }

  .card {
    background: var(--card);
    border-radius: 14px;
    overflow: hidden;
    transform: translateY(40px);
    opacity: 0;
    animation: fadeInUp 0.8s forwards;
  }

  .card:nth-child(2) { animation-delay: 0.2s; }
  .card:nth-child(3) { animation-delay: 0.4s; }
  .card:nth-child(4) { animation-delay: 0.6s; }

  .card img {
    width: 100%;
    height: 190px;
    object-fit: cover;
    transition: transform 0.5s ease;
  }

  .card:hover img {
    transform: scale(1.08);
  }

  .card h3 {
    margin: 18px 18px 8px;
    font-size: 20px;
  }

  .card p {
    margin: 0 18px 18px;
    font-size: 14px;
    color: #aaa;
    line-height: 1.6;
  }

  .card:hover {
    transform: translateY(-8px);
    box-shadow: 0 20px 40px rgba(108, 99, 255, 0.25);
    transition: all 0.4s ease;
  }

  footer {
    text-align: center;
    padding: 30px;
    font-size: 14px;
    color: #666;
  }

  @keyframes fadeInUp {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes fadeDown {
    from {
      opacity: 0;
      transform: translateY(-30px);
    }
    to {
      opacity: 1;
    }
  }

  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
    }
  }
</style>
</head>

<body>

<header>
  <h1>元宝的作品集</h1>
  <p>设计 · 开发 · 创意</p>
</header>

<div class="container">
  <div class="grid">

    <div class="card">
      <img src="https://picsum.photos/id/1016/800/500" alt="">
      <h3>品牌视觉系统</h3>
      <p>从 Logo 到色彩规范，构建统一且具辨识度的品牌形象。</p>
    </div>

    <div class="card">
      <img src="https://picsum.photos/id/1020/800/500" alt="">
      <h3>App 界面设计</h3>
      <p>专注交互与体验，打造流畅自然的移动端产品。</p>
    </div>

    <div class="card">
      <img src="https://picsum.photos/id/1039/800/500" alt="">
      <h3>数据可视化</h3>
      <p>将复杂数据转化为清晰、直观且美观的可视化图表。</p>
    </div>

    <div class="card">
      <img src="https://picsum.photos/id/1043/800/500" alt="">
      <h3>响应式官网</h3>
      <p>高性能、多端适配的企业级官方网站。</p>
    </div>

  </div>
</div>

<footer>
  © 2026 元宝 · 使用 AI 生成
</footer>

</body>
</html>
